name: torch_light_example
description: Demonstrates how to use the torch_light plugin.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: ^3.12.0

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  torch_light:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true